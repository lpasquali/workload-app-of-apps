# Full platform: core + Proxmox CSI. For Proxmox-free clusters, point Argo at `base/core` only, or
# use `examples/k8s-only` as the Git path. Override CSI Secret name with a patch (see `examples/`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - core
  - platform/proxmox-csi.yaml
