# Sync wave 6. VictoriaMetrics single (Service vmsingle for Grafana/OTel).
# Chart keys are under server.* — server.scrape.enabled turns on the chart’s full default Prometheus-compatible
# scrape config (apiserver, nodes/cAdvisor, kubernetes SD for prometheus.io annotations on pods & services).
# extraScrapeConfigs appends jobs for every Endpoints port named metrics|http-metrics (Argo CD operator
# Services, cert-manager, Kyverno, etc. often expose these without prometheus.io annotations).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-single
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: victoria-metrics
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-single
    targetRevision: "*"
    helm:
      values: |
        server:
          fullnameOverride: vmsingle
          scrape:
            enabled: true
            extraScrapeConfigs:
              - job_name: kubernetes-endpoints-metrics-ports
                kubernetes_sd_configs:
                  - role: endpoints
                relabel_configs:
                  - action: keep
                    source_labels: [__meta_kubernetes_endpoint_port_name]
                    regex: metrics|http-metrics
                  - action: replace
                    source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - action: replace
                    source_labels: [__meta_kubernetes_service_name]
                    target_label: service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
