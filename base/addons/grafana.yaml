# Sync wave 6. Grafana with VictoriaMetrics datasource (same pattern as bootstrap when VM is enabled).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: "*"
    helm:
      values: |
        service:
          type: ClusterIP
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: VictoriaMetrics
                type: prometheus
                url: http://vmsingle.victoria-metrics.svc:8428
                access: proxy
                isDefault: true
                jsonData:
                  httpMethod: POST
                  manageAlerts: true
                  prometheusType: Prometheus
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
        dashboards:
          default:
            k8s-cluster:
              gnetId: 7249
              revision: 1
              datasource: VictoriaMetrics
            k8s-api-server:
              gnetId: 12006
              revision: 1
              datasource: VictoriaMetrics
            victoriametrics-single:
              gnetId: 10229
              revision: 1
              datasource: VictoriaMetrics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
