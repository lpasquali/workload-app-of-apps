# Replace MY_CLUSTER with your CAPI/Cluster name (must match the Secret on the target cluster).
# Keep this in sync with `base/platform/proxmox-csi.yaml` when you bump the Helm chart/values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proxmox-csi
spec:
  source:
    helm:
      values: |
        existingConfigSecret: "MY_CLUSTER-proxmox-csi-config"
        existingConfigSecretKey: config.yaml
        config:
          features:
            provider: proxmox
          clusters: []
        storageClass:
          - name: proxmox-data-xfs
            storage: local-lvm
            reclaimPolicy: Delete
            fstype: xfs
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
