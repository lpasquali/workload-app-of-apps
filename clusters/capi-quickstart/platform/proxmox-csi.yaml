# Sync wave -2. Proxmox CSI (OCI). Bootstrap must create the Secret
# <WORKLOAD_CLUSTER_NAME>-proxmox-csi-config in the driver namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capi-quickstart-proxmox-csi
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: csi-proxmox
  source:
    # Same layout as bootstrap-capi.sh (PROXMOX_CSI_CHART_REPO_URL + name)
    repoURL: oci://ghcr.io/sergelogvinov/charts/proxmox-csi-plugin
    path: "."
    targetRevision: 0.5.7
    helm:
      values: |
        existingConfigSecret: "capi-quickstart-proxmox-csi-config"
        existingConfigSecretKey: config.yaml
        config:
          features:
            provider: proxmox
          clusters: []
        storageClass:
          - name: proxmox-data-xfs
            storage: local-lvm
            reclaimPolicy: Delete
            fstype: xfs
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
